components:
  schemas:
    ApiErrorResponse:
      type: object
      description: Esquema estándar para respuestas de error de la API.
      properties:
        success:
          type: boolean
          default: false
          description: Siempre es false en caso de error.
        code:
          type: string
          default: ERROR
          description: Código del error (ej. NOT_FOUND, PERMISSION_DENIED).
        message:
          type: string
          default: Ha ocurrido un error.
          description: Mensaje descriptivo del error.
        errors:
          type: object
          additionalProperties: {}
          nullable: true
          description: Detalle técnico adicional si está disponible.
        data:
          type: object
          additionalProperties: {}
          nullable: true
    AuthLogin:
      type: object
      description: Serializer para validar las credenciales de inicio de sesión.
      properties:
        username:
          type: string
          description: Nombre de usuario.
          maxLength: 150
        password:
          type: string
          writeOnly: true
          description: Contraseña del usuario.
      required:
      - password
      - username
    AuthLoginApiResponse:
      type: object
      description: Respuesta estandarizada de la API.
      properties:
        success:
          type: boolean
          default: true
          description: Indica si la operación fue exitosa.
        code:
          type: string
          default: SUCCESS
          description: Código interno del resultado de la operación.
        message:
          type: string
          default: Operación exitosa.
          description: Mensaje descriptivo del resultado.
        errors:
          type: object
          additionalProperties: {}
          nullable: true
          description: Detalle de errores si success es false.
        data:
          allOf:
          - $ref: '#/components/schemas/LoginResponse'
          description: Objeto de resultado.
      required:
      - data
    AuthLogout:
      type: object
      description: |-
        Serializer para el cierre de sesión.

        Valida que se proporcione el Refresh Token para invalidarlo.
      properties:
        refresh:
          type: string
      required:
      - refresh
    AuthLogoutApiResponse:
      type: object
      description: Respuesta estandarizada de la API.
      properties:
        success:
          type: boolean
          default: true
          description: Indica si la operación fue exitosa.
        code:
          type: string
          default: SUCCESS
          description: Código interno del resultado de la operación.
        message:
          type: string
          default: Operación exitosa.
          description: Mensaje descriptivo del resultado.
        errors:
          type: object
          additionalProperties: {}
          nullable: true
          description: Detalle de errores si success es false.
        data:
          type: object
          additionalProperties: {}
          nullable: true
          description: Datos dinámicos de la respuesta.
      required:
      - data
    AuthMeApiResponse:
      type: object
      description: Respuesta estandarizada de la API.
      properties:
        success:
          type: boolean
          default: true
          description: Indica si la operación fue exitosa.
        code:
          type: string
          default: SUCCESS
          description: Código interno del resultado de la operación.
        message:
          type: string
          default: Operación exitosa.
          description: Mensaje descriptivo del resultado.
        errors:
          type: object
          additionalProperties: {}
          nullable: true
          description: Detalle de errores si success es false.
        data:
          allOf:
          - $ref: '#/components/schemas/MeResponse'
          description: Objeto de resultado.
      required:
      - data
    AuthRefresh:
      type: object
      description: |-
        Serializer encargado de validar el Refresh Token recibido
        para generar un nuevo Access Token.
      properties:
        refresh:
          type: string
          description: Refresh Token del usuario.
      required:
      - refresh
    AuthRefreshApiResponse:
      type: object
      description: Respuesta estandarizada de la API.
      properties:
        success:
          type: boolean
          default: true
          description: Indica si la operación fue exitosa.
        code:
          type: string
          default: SUCCESS
          description: Código interno del resultado de la operación.
        message:
          type: string
          default: Operación exitosa.
          description: Mensaje descriptivo del resultado.
        errors:
          type: object
          additionalProperties: {}
          nullable: true
          description: Detalle de errores si success es false.
        data:
          allOf:
          - $ref: '#/components/schemas/AuthRefreshResponse'
          description: Objeto de resultado.
      required:
      - data
    AuthRefreshResponse:
      type: object
      description: |-
        Serializer utilizado para documentar la respuesta
        del endpoint de renovación de tokens.
      properties:
        access:
          type: string
          description: Nuevo Access Token.
      required:
      - access
    CustomerCreate:
      type: object
      description: |-
        Serializer utlizado para crear un cliente.

        La persistencia es delegada al CustomerService para
        mantener separadas las responsabilidades.
      properties:
        document_type:
          allOf:
          - $ref: '#/components/schemas/DocumentTypeEnum'
          title: Tipo de Documento
          description: |-
            Tipo de documento del cliente (CC, NIT, CE, PAS, TI).

            * `CC` - Cédula de Ciudadanía
            * `NIT` - Número de Identificación Tributaria
            * `CE` - Cédula de Extranjería
            * `PAS` - Pasaporte
            * `TI` - Tarjeta de Identidad
        document_number:
          type: string
          title: Número de Documento
          description: Número único de identidad del cliente.
          maxLength: 30
        first_name:
          type: string
          title: Nombres
          maxLength: 100
        last_name:
          type: string
          title: Apellidos
          maxLength: 100
        business_name:
          type: string
          title: Razón Social
          description: Nombre de la empresa o razón social del cliente.
          maxLength: 200
        email:
          title: Correo Electrónico
          description: Correo electrónico del cliente.
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          title: Teléfono
          description: Número de teléfono del cliente.
          maxLength: 30
        mobile:
          type: string
          title: Celular
          description: Número de celular del cliente.
          maxLength: 30
        address:
          type: string
          title: Dirección
          description: Dirección física del cliente.
          maxLength: 255
        city:
          type: string
          title: Ciudad
          description: Ciudad de residencia del cliente.
          maxLength: 100
        country:
          type: string
          title: País
          description: País de residencia del cliente.
          maxLength: 100
        notes:
          type: string
          title: Notas
          description: Notas adicionales sobre el cliente.
        is_active:
          type: boolean
          title: Estado
          description: Indica si el cliente está activo en el sistema.
      required:
      - document_number
      - document_type
    CustomerCreateApiResponse:
      type: object
      description: Respuesta estandarizada de la API.
      properties:
        success:
          type: boolean
          default: true
          description: Indica si la operación fue exitosa.
        code:
          type: string
          default: SUCCESS
          description: Código interno del resultado de la operación.
        message:
          type: string
          default: Operación exitosa.
          description: Mensaje descriptivo del resultado.
        errors:
          type: object
          additionalProperties: {}
          nullable: true
          description: Detalle de errores si success es false.
        data:
          allOf:
          - $ref: '#/components/schemas/CustomerDetail'
          description: Objeto de resultado.
      required:
      - data
    CustomerDeleteApiResponse:
      type: object
      description: Respuesta estandarizada de la API.
      properties:
        success:
          type: boolean
          default: true
          description: Indica si la operación fue exitosa.
        code:
          type: string
          default: SUCCESS
          description: Código interno del resultado de la operación.
        message:
          type: string
          default: Operación exitosa.
          description: Mensaje descriptivo del resultado.
        errors:
