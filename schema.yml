openapi: 3.0.3
info:
  title: inventario-pme API
  version: 1.0.0
  description: API REST empresarial del sistema inventario-pme.\n\nEsta API proporciona
    acceso completo a los módulos, de inventario-pme ERP.\n\n**Características Principales:**\n-
    Respuestas estandarizadas en formato JSON.\n- Autenticación segura mediante tokens
    JWT.\n- Paginación unificada y filtros avanzados.
  termsOfService: https://www.inventario-pme.com/terms/
  contact:
    name: Soporte inventario-pme
    url: ''
    email: jhansancheza@gmail.com
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Autentica un usuario utilizando su nombre de usuario y contraseña.
        Si las credenciales son válidas, retorna la información del usuario junto
        con un Access Token y un Refresh Token JWT.
      summary: Iniciar sesión
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogin'
            examples:
              EjemploDeLoginExitoso:
                value:
                  username: software_inventario-pme
                  password: '12345678'
                summary: Ejemplo de Login Exitoso
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthLogin'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginApiResponse'
          description: Inicio de sesión exitoso.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Credenciales inválidas (error de validación).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: 'Usuario o contraseña incorrectos. Código posible: AUTHENTICATION_FAILED.'
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalida el Refresh Token proporcionado.
      summary: Cerrar sesión
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthLogout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthLogout'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutApiResponse'
          description: Sesión cerrada correctamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Token no proporcionado.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: No autenticado.
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retorna la información del usuario autenticado a partir del Access
        Token enviado en el encabezado Authorization.
      summary: Obtener usuario autenticado
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeApiResponse'
          description: Información del usuario autenticado.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: 'Token inválido o expirado. Código posible: AUTHENTICATION_FAILED.'
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Genera un nuevo Access Token a partir de un Refresh Token válido.
      summary: Renovar Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthRefresh'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshApiResponse'
          description: Token renovado exitosamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Token no enviado o inválido.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: 'Token expirado o no válido para renovación. Código posible:
            AUTHENTICATION_FAILED.'
  /api/v1/customers/:
    get:
      operationId: customers_list
      description: Obtiene el listado paginado de clientes registrados en el sistema.
      summary: Listar clientes
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página para la paginación.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Cantidad de resultados por página.
      tags:
      - Customers
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerListApiResponseList'
          description: Clientes obtenidos correctamente.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para consultar clientes.
    post:
      operationId: customers_create
      description: Registra un nuevo cliente en el sistema. El número de documento
        debe ser único.
      summary: Crear cliente
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
            examples:
              CrearCliente:
                value:
                  document_type: CC
                  document_number: '123456789'
                  first_name: Juan
                  last_name: Pérez
                  email: juan@example.com
                  phone_number: '3001234567'
                  is_active: true
                summary: Crear Cliente
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCreateApiResponse'
          description: Cliente creado correctamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: 'Los datos enviados no son válidos. Códigos posibles: CUSTOMER_ALREADY_EXISTS.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para crear clientes.
  /api/v1/customers/{id_customer}/:
    get:
      operationId: customers_retrieve
      description: Obtiene la información detallada de un cliente mediante su identificador.
      summary: Obtener cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Identificador único del cliente.
        required: true
      - in: path
        name: id_customer
        schema:
          type: integer
          title: ID
        description: Un valor de entero único que identifique este cliente.
        required: true
      tags:
      - Customers
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailApiResponse'
          description: Cliente obtenido correctamente.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para consultar clientes.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Cliente no encontrado.
    put:
      operationId: customers_update
      description: Actualiza completamente la información de un cliente existente.
      summary: Actualizar cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Identificador único del cliente a actualizar.
        required: true
      - in: path
        name: id_customer
        schema:
          type: integer
          title: ID
        description: Un valor de entero único que identifique este cliente.
        required: true
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerUpdateApiResponse'
          description: Cliente actualizado correctamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: 'Los datos enviados no son válidos. Códigos posibles: CUSTOMER_ALREADY_EXISTS.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para actualizar clientes.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Cliente no encontrado.
    patch:
      operationId: customers_partial_update
      description: Actualiza parcialmente la información de un cliente existente.
      summary: Actualizar parcialmente cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Identificador único del cliente a actualizar parcialmente.
        required: true
      - in: path
        name: id_customer
        schema:
          type: integer
          title: ID
        description: Un valor de entero único que identifique este cliente.
        required: true
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomerUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomerUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomerUpdate'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPartialUpdateApiResponse'
          description: Cliente actualizado correctamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: 'Los datos enviados no son válidos. Códigos posibles: CUSTOMER_ALREADY_EXISTS.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para actualizar clientes.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Cliente no encontrado.
    delete:
      operationId: customers_destroy
      description: Desactiva lógicamente un cliente. El registro no se elimina físicamente
        de la base de datos.
      summary: Desactivar cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Identificador único del cliente a desactivar.
        required: true
      - in: path
        name: id_customer
        schema:
          type: integer
          title: ID
        description: Un valor de entero único que identifique este cliente.
        required: true
      tags:
      - Customers
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDeleteApiResponse'
          description: Cliente desactivado correctamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: 'No fue posible desactivar el cliente. Códigos posibles: CUSTOMER_INACTIVE.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para eliminar clientes.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Cliente no encontrado.
  /api/v1/customers/{id_customer}/restore/:
    post:
      operationId: customers_restore_create
      description: Reactiva un cliente previamente desactivado.
      summary: Restaurar cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Identificador único del cliente a restaurar.
        required: true
      - in: path
        name: id_customer
        schema:
          type: integer
          title: ID
        description: Un valor de entero único que identifique este cliente.
        required: true
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerDetail'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRestoreApiResponse'
          description: Cliente restaurado correctamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: No fue posible restaurar el cliente.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para restaurar clientes.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Cliente no encontrado.
  /api/v1/roles/:
    get:
      operationId: roles_list
      description: Obtiene el listado paginado de todos los roles registrados en el
        sistema.
      summary: Listar roles
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página para la paginación.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Cantidad de resultados por página.
      tags:
      - Roles
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleListResponseList'
          description: Listado de roles obtenido correctamente.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para consultar roles.
    post:
      operationId: roles_create
      description: Crea un nuevo rol dentro del sistema. El campo 'permissions' recibe
        un JSON con los permisos activos del rol basado en el SecurityRegistry.
      summary: Crear rol
      tags:
      - Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
            examples:
              CrearRol:
                value:
                  role_name: Administrador
                  role_description: Control total del sistema
                  is_active: true
                  permissions:
                    users.view: true
                    users.create: true
                    customers.view: true
                summary: Crear Rol
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleCreate'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleCreateResponse'
          description: Rol creado correctamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: 'Datos inválidos. Códigos posibles: ROLE_ALREADY_EXISTS, INVALID_ROLE_PERMISSIONS.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para crear roles.
  /api/v1/roles/{id_role}/:
    get:
      operationId: roles_retrieve
      description: Obtiene la información detallada de un rol específico.
      summary: Obtener rol
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Identificador único del rol.
        required: true
      - in: path
        name: id_role
        schema:
          type: integer
          title: ID
        description: Un valor de entero único que identifique este Rol.
        required: true
      tags:
      - Roles
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetailResponse'
          description: Información del rol obtenida correctamente.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para consultar roles.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Rol no encontrado.
    put:
      operationId: roles_update
      description: Actualiza completamente un rol.
      summary: Actualizar rol
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Identificador único del rol a actualizar.
        required: true
      - in: path
        name: id_role
        schema:
          type: integer
          title: ID
        description: Un valor de entero único que identifique este Rol.
        required: true
      tags:
      - Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleUpdateResponse'
          description: Rol actualizado correctamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: 'Datos inválidos. Códigos posibles: ROLE_ALREADY_EXISTS, INVALID_ROLE_PERMISSIONS.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para actualizar roles.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Rol no encontrado.
    patch:
      operationId: roles_partial_update
      description: Actualiza uno o varios campos de un rol.
      summary: Actualizar parcialmente un rol
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Identificador único del rol a actualizar parcialmente.
        required: true
      - in: path
        name: id_role
        schema:
          type: integer
          title: ID
        description: Un valor de entero único que identifique este Rol.
        required: true
      tags:
      - Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleUpdate'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePartialUpdateResponse'
          description: Rol actualizado correctamente.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: 'Datos inválidos. Códigos posibles: ROLE_ALREADY_EXISTS, INVALID_ROLE_PERMISSIONS.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Token inválido, expirado o usuario no autenticado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: El usuario no tiene permiso para actualizar roles.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Rol no encontrado.
    delete:
      operationId: roles_destroy
      description: Realiza el borrado lógico del rol.
      summary: Desactivar rol
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Identificador único del rol a desactivar.
        required: true
      - in: path
        name: id_role
        schema:
          type: integer
          title: ID
        description: Un valor de entero único que identifique este Rol.
        required: true
      tags:
      - Roles
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDeleteResponse'
