# ==============================================================================
# Blueprint de Render para Despliegue de Producción
# Software de Inventarios P.M.E.
# ==============================================================================
# Permite crear el servicio Web en Render de forma reproducible.
# No contiene credenciales ni ejecuta operaciones destructivas sobre la base de datos.
# ==============================================================================

services:
  - type: web
    name: inventario-pme-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CONN_MAX_AGE
        value: "60"
      - key: CONN_HEALTH_CHECKS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: TRUST_X_FORWARDED_FOR
        value: "True"
